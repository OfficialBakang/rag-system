
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks - Python 3.12 - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    env:
      OTEL_ENABLED: "false"
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.tokenizer-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run Ruff linting
        run: python -m ruff check tests/ core/chunker.py core/ingestion_pipeline.py core/telemetry.py core/evals.py core/vector_store.py api.py rag_config.py scripts/docker_smoke.py

      - name: Prepare tokenizer cache
        run: python -c "import tiktoken; tiktoken.get_encoding('cl100k_base'); print('Tokenizer ready')"

      
      - name: Run automated tests and enforce coverage
        run: >
          python -m pytest tests/
          -v
          --tb=short
          --cov=core
          --cov=api
          --cov=rag_config
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --cov-fail-under=85


      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14

  
  docker:
    name: Docker build and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --no-env-resolution --quiet

      - name: Build runtime image
        run: docker build --target runtime -t rag-system:smoke .

      - name: Report image size in bytes
        run: docker image inspect --format '{{.Size}}' rag-system:smoke

      - name: Exercise isolated runtime
        run: python scripts/docker_smoke.py --image rag-system:smoke

