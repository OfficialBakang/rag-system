
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks - Python 3.12 - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    env:
      OTEL_ENABLED: "false"
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.tokenizer-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run Ruff linting
        run: python -m ruff check tests/ core/chunker.py core/ingestion_pipeline.py core/telemetry.py core/evals.py core/vector_store.py core/generator.py core/retriever.py core/embedder.py core/loader.py api.py rag_config.py api_security.py scripts/docker_smoke.py scripts/migration scripts/benchmark_storage.py

      - name: Prepare tokenizer cache
        run: python -c "import tiktoken; tiktoken.get_encoding('cl100k_base'); print('Tokenizer ready')"

      
      - name: Run automated tests and enforce coverage
        run: >
          python -m pytest tests/
          -v
          --tb=short
          --cov=core
          --cov=api
          --cov=rag_config
          --cov=api_security
          --cov=scripts.migration.import_bundle
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --cov-fail-under=85


      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14

  
  docker:
    name: Docker build and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --no-env-resolution --quiet

      - name: Build runtime image
        run: docker build --target runtime -t rag-system:smoke .

      - name: Report image size in bytes
        run: docker image inspect --format '{{.Size}}' rag-system:smoke

      - name: Exercise isolated runtime
        run: python scripts/docker_smoke.py --image rag-system:smoke


  security:
    name: Security verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install isolated scanners
        run: python -m pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Check runtime source with Bandit
        run: python -m bandit -r core api.py rag_config.py api_security.py
      - name: Audit runtime dependencies including transitive dependencies
        if: ${{ !cancelled() }}
        run: |
          status=0
          python -m pip_audit --strict -r requirements.txt --format json --output audit.json || status=$?
          python - "$status" <<'PY'
          import json, pathlib, sys
          report = pathlib.Path("audit.json")
          if not report.is_file():
              sys.exit("Dependency audit infrastructure failure: no report")
          packages = json.loads(report.read_text())["dependencies"]
          if not packages or any("skip_reason" in p for p in packages):
              sys.exit("Dependency audit incomplete")
          findings = [(p["name"], p["version"], v["id"], v["fix_versions"]) for p in packages for v in p["vulns"]]
          for finding in findings:
              print(*finding)
          if findings:
              sys.exit("Dependency vulnerabilities detected")
          if sys.argv[1] != "0":
              sys.exit("Dependency audit infrastructure failure")
          PY
      - name: Build runtime for scanning
        id: image
        if: ${{ !cancelled() }}
        run: docker build --target runtime -t rag-system:security .
      - name: Scan runtime image for high and critical vulnerabilities
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: rag-system:security
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '42'
          format: table
